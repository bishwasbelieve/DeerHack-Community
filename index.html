<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Help & Lost+Found</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
     
</head>
<body>

    <!-- LOGIN/SIGNUP MODAL -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h2 id="authTitle">🔐 Login to Continue</h2>
            <p class="auth-subtitle">Connect with your local community</p>
            
            <form id="authForm">
                <!-- NAME FIELDS (Only shown during signup) -->
                <div id="nameFields" style="display: none;">
                    <div class="form-group">
                        <label>First Name:</label>
                        <input type="text" id="firstName" placeholder="John">
                    </div>

                    <div class="form-group">
                        <label>Last Name:</label>
                        <input type="text" id="lastName" placeholder="Doe">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="authEmail" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="authPassword" placeholder="Min 6 characters" required>
                </div>

                <button type="submit" class="btn-auth" id="authSubmitBtn">Login</button>
            </form>

            <p class="auth-toggle">
                <span id="authToggleText">Don't have an account?</span>
                <a href="#" id="authToggleLink">Sign Up</a>
            </p>
        </div>
    </div>

    <div class="container" id="mainApp" style="display: none;">
        <!-- USER INFO BAR -->
        <div class="user-bar">
            <span id="userInfo">Loading...</span>
            <button id="logoutBtn" class="btn-logout">🚪 Logout</button>
        </div>

        <!-- HEADER -->
        <header>
            <h1>🤝 Community Help & Lost+Found</h1>
            <p>Connect with your local community</p>
        </header>

        <!-- CREATE POST FORM -->
        <section class="form-section">
            <h2>Create a Post</h2>
            <form id="postForm">
                <div class="form-group">
                    <label>Post Type:</label>
                    <select id="type" required>
                        <option value="help-needed">🆘 Help Needed</option>
                        <option value="lost">😢 Lost Item</option>
                        <option value="found">🎉 Found Item</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Area/Ward:</label>
                    <select id="area" required>
                        <option value="Ward 1">Ward 1</option>
                        <option value="Ward 2">Ward 2</option>
                        <option value="Ward 3">Ward 3</option>
                        <option value="Ward 4">Ward 4</option>
                        <option value="Ward 5">Ward 5</option>
                        <option value="Ward 6">Ward 6</option>
                        <option value="Ward 7">Ward 7</option>
                        <option value="Ward 8">Ward 8</option>
                        <option value="Ward 9">Ward 9</option>
                        <option value="Ward 10">Ward 10</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Title:</label>
                    <input type="text" id="title" placeholder="e.g., Need a plumber" required>
                </div>

                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="description" rows="4" placeholder="Provide details..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Your Name:</label>
                    <input type="text" id="contactName" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label>Contact Phone:</label>
                    <input type="tel" id="contactPhone" placeholder="9876543210" required>
                </div>

                <button type="submit" class="btn-submit">📤 Post</button>
            </form>
        </section>

        <!-- FILTER SECTION -->
        <section class="filter-section">
            <h2>Browse Posts</h2>
            <div class="filters">
                <select id="filterType">
                    <option value="all">All Types</option>
                    <option value="help-needed">🆘 Help Needed</option>
                    <option value="lost">😢 Lost</option>
                    <option value="found">🎉 Found</option>
                </select>

                <select id="filterArea">
                    <option value="all">All Areas</option>
                    <option value="Ward 1">Ward 1</option>
                    <option value="Ward 2">Ward 2</option>
                    <option value="Ward 3">Ward 3</option>
                    <option value="Ward 4">Ward 4</option>
                    <option value="Ward 5">Ward 5</option>
                </select>

                <button id="applyFilter" class="btn-filter">🔍 Filter</button>
            </div>
        </section>

        <!-- POSTS DISPLAY -->
        <section class="posts-section">
            <div id="postsContainer">
                <p class="loading">Loading posts...</p>
            </div>
        </section>
    </div>
<script>
    
</script>
    <script type="module" src="app.js"></script>
</body>
</html>
