<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Initial Page</title>

    <!-- Internal CSS to improve navbar and add animated background + centered button -->
    <style>
        :root{
            --nav-start: #4e54c8;
            --nav-end: #8f94fb;
            --accent: #ffd166;
            --muted: rgba(255,255,255,0.85);
            --bg-accent-1: #7f5af0;
            --bg-accent-2: #4fd1c5;
            --bg-accent-3: #ffd166;
        }

        /* Base navbar (unchanged) */
        .navbar{
            background: linear-gradient(90deg,var(--nav-start),var(--nav-end));
            color: #fff;
            padding: 0.5rem 1rem;
            box-shadow: 0 4px 18px rgba(0,0,0,0.12);
            position: sticky;
            top: 0;
            z-index: 50;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        .container-fluid{
            display:flex;
            align-items:center;
            gap:1rem;
            flex-wrap:wrap;
        }

        .navbar-brand{
            color:#fff;
            font-weight:700;
            letter-spacing:0.3px;
            text-decoration:none;
            display:flex;
            align-items:center;
            gap:0.6rem;
        }
        .navbar-brand::before{
            content:"";
            width:32px;
            height:32px;
            background:var(--accent);
            border-radius:6px;
            box-shadow:0 2px 8px rgba(0,0,0,0.12);
            display:inline-block;
        }

        .navbar-toggler{
            background: transparent;
            border: 2px solid rgba(255,255,255,0.15);
            color: #fff;
            padding:6px 8px;
            border-radius:6px;
            cursor:pointer;
            display:inline-flex;
            align-items:center;
            gap:0.5rem;
        }
        .navbar-toggler-icon{
            width:18px;
            height:2px;
            background:#fff;
            display:block;
            position:relative;
        }
        .navbar-toggler-icon::after,
        .navbar-toggler-icon::before{
            content:"";
            width:18px;
            height:2px;
            background:#fff;
            display:block;
            position:absolute;
            left:0;
        }
        .navbar-toggler-icon::before{ top:-6px; }
        .navbar-toggler-icon::after{ top:6px; }

        .navbar-collapse{
            display:flex;
            align-items:center;
            justify-content:space-between;
            flex:1 1 auto;
            gap:1rem;
        }

        .navbar-nav{
            list-style:none;
            margin:0;
            padding:0;
            display:flex;
            gap:0.25rem;
            align-items:center;
            flex-wrap:wrap;
        }

        .nav-link{
            color:var(--muted);
            text-decoration:none;
            padding:8px 12px;
            border-radius:6px;
            transition:all 160ms ease;
            font-weight:500;
            font-size:0.95rem;
        }
        .nav-link:hover,
        .nav-link.active{
            background: rgba(255,255,255,0.08);
            color:#fff;
            transform:translateY(-1px);
        }
        .nav-link.disabled{
            opacity:0.55;
            cursor:not-allowed;
        }

        .nav-item.dropdown{ position:relative; }
        .dropdown-menu{
            display:none;
            position:absolute;
            top:calc(100% + 6px);
            left:0;
            min-width:200px;
            background:#fff;
            color:#333;
            border-radius:8px;
            padding:6px 6px;
            box-shadow:0 10px 30px rgba(16,24,40,0.12);
            overflow:hidden;
            z-index:60;
        }
        .dropdown-item{
            display:block;
            padding:8px 12px;
            color:#333;
            text-decoration:none;
            border-radius:6px;
            transition:background 120ms ease;
            font-size:0.95rem;
        }
        .dropdown-item:hover{ background: #f3f4f6; }

        .nav-item.dropdown:hover .dropdown-menu{ display:block; }

        .dropdown-divider{
            height:1px;
            margin:6px 0;
            background:#eee;
            border:none;
        }

        .d-flex{ display:flex; gap:8px; align-items:center; }
        .form-control{
            padding:8px 10px;
            border-radius:8px;
            border:1px solid rgba(0,0,0,0.08);
            min-width:180px;
            transition:box-shadow 160ms ease, border-color 160ms ease;
        }
        .form-control:focus{
            outline:none;
            box-shadow:0 6px 18px rgba(79,70,229,0.12);
            border-color: rgba(79,70,229,0.6);
        }
        .btn{
            padding:8px 12px;
            border-radius:8px;
            border:0;
            background: rgba(255,255,255,0.12);
            color:#fff;
            cursor:pointer;
            transition:transform 120ms ease, background 120ms ease;
        }
        .btn:hover{ transform:translateY(-2px); background: rgba(255,255,255,0.18); }

        @media (max-width:767px){
            .container-fluid{ gap:0.5rem; }
            .navbar-brand{ flex:1 1 auto; }
            .navbar-toggler{ display:inline-flex; }
            .navbar-collapse{
                width:100%;
                flex-direction:column;
                align-items:stretch;
                gap:0.5rem;
            }
            .navbar-nav{
                flex-direction:column;
                gap:0.25rem;
                width:100%;
            }
            .dropdown-menu{
                position:static;
                box-shadow:none;
                background:#fff;
                border-radius:6px;
            }
            .d-flex{ width:100%; justify-content:space-between; gap:6px; }
            .form-control{ flex:1 1 auto; min-width:0; }
        }

        @media (min-width:768px){
            .navbar-toggler{ display:none; }
        }

        /* ---------------------------
           Animated background & hero
           --------------------------- */

        /* Ensure body fills viewport and allow animated bg */
        html, body {
            height: 100%;
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: #0f1724;
            color: #fff;
        }

        /* Hero area that sits below navbar and fills remaining viewport */
        .hero {
            position: relative;
            min-height: calc(100vh - 64px);
            /* fallback color */
            background: linear-gradient(135deg, rgba(15,23,36,0.6), rgba(12,18,28,0.6));
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated gradient layer */
        .hero__gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, var(--bg-accent-1), var(--bg-accent-2), var(--bg-accent-3));
            background-size: 300% 300%;
            opacity: 0.85;
            filter: saturate(1.05) contrast(1.02);
            z-index: 0;
            animation: gradientShift 12s ease infinite;
            mix-blend-mode: screen;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; transform: scale(1) rotate(0deg); }
            50% { background-position: 100% 50%; transform: scale(1.03) rotate(1deg); }
            100% { background-position: 0% 50%; transform: scale(1) rotate(0deg); }
        }

        /* Soft moving blurred blobs to add depth */
        .hero__blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.65;
            transform: translate3d(0,0,0);
            z-index: 0;
            pointer-events: none;
        }
        .blob--one {
            width: 360px;
            height: 360px;
            background: radial-gradient(circle at 30% 30%, rgba(127,90,240,0.9), rgba(127,90,240,0.4) 40%, transparent 60%);
            left: -6%;
            top: -10%;
            animation: floatOne 15s ease-in-out infinite;
        }
        .blob--two {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle at 70% 30%, rgba(79,209,197,0.9), rgba(79,209,197,0.35) 40%, transparent 60%);
            right: -12%;
            top: 10%;
            animation: floatTwo 18s ease-in-out infinite;
        }
        .blob--three {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle at 50% 50%, rgba(255,209,102,0.95), rgba(255,209,102,0.25) 45%, transparent 65%);
            left: 10%;
            bottom: -8%;
            animation: floatThree 20s ease-in-out infinite;
        }

        @keyframes floatOne {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            50% { transform: translateY(24px) scale(1.04); opacity: 0.75; }
            100% { transform: translateY(0) scale(1); opacity: 0.6; }
        }
        @keyframes floatTwo {
            0% { transform: translateY(0) scale(1); opacity: 0.55; }
            50% { transform: translateY(-28px) scale(1.06); opacity: 0.7; }
            100% { transform: translateY(0) scale(1); opacity: 0.55; }
        }
        @keyframes floatThree {
            0% { transform: translateY(0) scale(1); opacity: 0.5; }
            50% { transform: translateY(36px) scale(1.08); opacity: 0.68; }
            100% { transform: translateY(0) scale(1); opacity: 0.5; }
        }

        /* Centered content layer (above background) */
        .hero__content {
            position: relative;
            z-index: 2;
            display:flex;
            align-items:center;
            justify-content:center;
            width:100%;
            padding: 3rem 1rem;
            pointer-events: none; /* allow only button to receive pointer events */
        }

        .center-card {
            pointer-events: auto;
            background: rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 28px 36px;
            box-shadow: 0 10px 30px rgba(2,6,23,0.5);
            backdrop-filter: blur(6px) saturate(120%);
            display:flex;
            flex-direction:column;
            gap: 18px;
            align-items:center;
            min-width: 260px;
            max-width: 720px;
            text-align:center;
            color: #fff;
        }

        .hero__title {
            margin: 0;
            font-size: clamp(1rem, 2.4vw, 1.5rem);
            font-weight: 700;
            letter-spacing: 0.2px;
            color: #fff;
        }
        .hero__subtitle {
            margin: 0;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.9);
            opacity: 0.9;
        }

        /* Prominent central button */
        .cta-btn {
            --btn-bg: rgba(255,255,255,0.12);
            display:inline-flex;
            gap: 10px;
            align-items:center;
            justify-content:center;
            padding: 12px 22px;
            border-radius: 12px;
            background: linear-gradient(90deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.2px;
            text-decoration: none;
            border: 0;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(16,24,40,0.6);
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
            font-size: 1rem;
        }
        .cta-btn:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 18px 50px rgba(16,24,40,0.65);
        }
        .cta-btn:active { transform: translateY(-2px); }
        .cta-btn:focus {
            outline: none;
            box-shadow: 0 0 0 6px rgba(127,90,240,0.12), 0 12px 40px rgba(16,24,40,0.6);
            border-radius: 12px;
        }

        /* small responsive tweaks */
        @media (max-width: 560px) {
            .center-card { padding: 20px; }
            .cta-btn { padding: 10px 16px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>

            <button class="navbar-toggler" type="button" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" aria-expanded="false">
                            Dropdown
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                </ul>

                <form class="d-flex" role="search" onsubmit="event.preventDefault();">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Hero with animated background and centered button -->
    <section class="hero" aria-hidden="false">
        <div class="hero__gradient" aria-hidden="true"></div>

        <!-- soft blobs -->
        <div class="hero__blob blob--one" aria-hidden="true"></div>
        <div class="hero__blob blob--two" aria-hidden="true"></div>
        <div class="hero__blob blob--three" aria-hidden="true"></div>

        <div class="hero__content">
            <div class="center-card" role="region" aria-label="Center call to action">
                <h1 class="hero__title">Welcome</h1>
                <p class="hero__subtitle">A subtle animated background with a prominent central button.</p>
                <button class="cta-btn" onclick="window.location.href='index.html'" type="button" >Get Started</button>
            </div>
        </div>
    </section>

    <!-- small script to keep hero height adaptive if navbar height changes -->
    <script>
        // Adjust hero min-height to viewport minus navbar height for various layouts
        (function adjustHero() {
            const hero = document.querySelector('.hero');
            const nav = document.querySelector('.navbar');
            if (!hero || !nav) return;
            function update() {
                const navH = nav.getBoundingClientRect().height;
                hero.style.minHeight = `calc(100vh - ${navH}px)`;
            }
            update();
            new ResizeObserver(update).observe(document.body);
            window.addEventListener('orientationchange', update);
        })();
    </script>
</body>
</html>
